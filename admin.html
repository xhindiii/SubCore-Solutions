<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — SubCore Solutions</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<section id="login" class="login-screen" hidden>
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand"><img src="logo.png" alt="SubCore Solutions" width="141" height="50"></div>
    <h1>Admin sign in</h1>
    <p class="muted">Manage products, orders and enquiries.</p>
    <div class="form-group"><label for="login-email">Email</label><input type="email" id="login-email" autocomplete="username" required></div>
    <div class="form-group"><label for="login-pass">Password</label><input type="password" id="login-pass" autocomplete="current-password" required></div>
    <div class="form-status error" id="login-error" role="alert" hidden></div>
    <button type="submit" class="button button-block">Sign in</button>
    <a class="back-link" href="index.html">← Back to website</a>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-brand"><img src="logo.png" alt="SubCore Solutions" width="113" height="40"></div>
    <nav class="side-nav" id="nav" aria-label="Admin sections"></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <a href="index.html" target="_blank" rel="noopener" class="side-link">View website</a>
      <button type="button" class="side-link" id="logout">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="page-title"></h1>
      <div class="topbar-actions" id="page-actions"></div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Admin sections"></nav>
</div>

<div id="drawer-root"></div>
<div class="toast-container" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
